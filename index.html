<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3_ES - ورود به پنل</title>
    <!-- استایل‌ها و کتابخانه‌های پنل -->
    <link rel="stylesheetpx" href="/css/app.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <!-- تغییر نام برند به M3_ES -->
            <h1 class="brand-title">M3_ES</h1>
            <div class="welcome-divider"></div>
            <h2 class="welcome-text">خوش آمدید</h2>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">نام کاربری</label>
                    <div class="input-wrapper">
                        <i class="icon-user"></i>
                        <input type="text" id="username" name="username" placeholder="نام کاربری" value="admin" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">رمزعبور</label>
                    <div class="input-wrapper">
                        <i class="icon-lock"></i>
                        <input type="password" id="password" name="password" placeholder="رمزعبور" value="admin" required>
                        <i class="icon-eye-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">ورود</button>
            </form>
        </div>
    </div>
</body>
</html>
