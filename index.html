<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل سفارشی‌سازی کانفیگ</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030407;
            --panel: rgba(10, 12, 19, 0.85);
            --border: rgba(0, 242, 254, 0.25);
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.3);
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.5);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header-box {
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }

        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
            height: 140px;
            resize: vertical;
            outline: none;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .row input:focus {
            border-color: var(--accent);
        }

        .code-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
            max-height: 180px;
            overflow-y: auto;
            word-break: break-all;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
        }

        .code-box::-webkit-scrollbar {
            width: 5px;
        }
        .code-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #4facfe);
            color: #030407;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px var(--accent-glow);
            font-family: inherit;
        }

        .btn-primary:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10, 12, 19, 0.95);
            border: 1px solid var(--accent);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Logo" class="brand-logo" id="brandLogo">
            <div>
                <div class="brand-title">ماتین وی‌پی‌ان // شخصی‌ساز کانفیگ</div>
                <div class="brand-subtitle">Custom Config Generator</div>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">ورودی کانفیگ‌های خام (Custom Links)</label>
            <textarea id="rawInput" placeholder="vless://... یا ss://... لینک‌های خود را اینجا وارد کنید">vless://e51796bb-3305-ac88-f39d-22fd9dd63b4f@170.168.99.3:443?mode=auto&path=%2F&security=reality&encryption=none&pbk=R8Mogel1wypEIpcUXnGmG1cuzT9POghNhqJcw4-CLx0&fp=chrome&type=xhttp&sni=cdn.steamstatic.com#OldName
ss://Y2hhY2hhMjAtaWV0Zi1wb2x5MTMwNTpYRjBrbHc3ODcwdlhuM3VRSXhlMTlR@146.70.222.126:1080#OldName2</textarea>
        </div>

        <div class="row">
            <div class="input-group" style="flex: 1;">
                <label class="input-label">تگ سفارشی نام (Custom Remark)</label>
                <input type="text" id="remarkInput" value="MatinVPN⚡️">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-primary" onclick="processConfigs()" style="height: 47px; padding: 0 20px;">پردازش</button>
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">خروجی نهایی کانفیگ‌ها</label>
            <div class="code-box" id="contentBox">کانفیگ‌های سفارشی‌شده پس از پردازش اینجا نمایش داده می‌شوند...</div>
        </div>

        <button class="btn-primary" onclick="copyContent()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            کپی کردن تمام کانفیگ‌ها
        </button>
    </div>

    <div class="toast" id="toast">کانفیگ‌ها با موفقیت کپی شدند!</div>

    <script>
        // قرار دادن عکس آپلود شده به صورت Base64 روی لوگو
        const uploadedImageBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="; 
        // در اینجا برای اطمینان از نمایش صحیح تصویر ارسالی شما، آدرس جایگزین می‌شود:
        document.getElementById('brandLogo').src = "https://i.ibb.co/3ykWvW1/1000003203-2.png"; // یا می‌توانید از تگ تصویر خود کاربر استفاده کنید

        function processConfigs() {
            const rawText = document.getElementById('rawInput').value.trim();
            const remark = document.getElementById('remarkInput').value.trim() || 'MatinVPN';
            
            if (!rawText) {
                document.getElementById('contentBox').innerText = 'لطفاً حداقل یک کانفیگ وارد کنید.';
                return;
            }

            const lines = rawText.split(/\r?\n/);
            let processed = [];
            let index = 1;

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed || !trimmed.includes('://')) return;

                let cleanUri = trimmed.split('#')[0];
                let customName = `${remark} %23${index++}`;
                
                if (trimmed.startsWith('vmess://')) {
                    try {
                        let base64Part = trimmed.replace('vmess://', '').split('#')[0];
                        let json = JSON.parse(atob(base64Part));
                        json.ps = decodeURIComponent(customName);
                        let newVmess = 'vmess://' + btoa(unescape(encodeURIComponent(JSON.stringify(json))));
                        processed.push(newVmess);
                        return;
                    } catch(e) {}
                }
                
                processed.push(cleanUri + '#' + customName);
            });

            document.getElementById('contentBox').innerText = processed.join('\n');
        }

        function copyContent() {
            const text = document.getElementById('contentBox').innerText;
            if (!text || text.startsWith('لطفاً')) return;

            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error('خطا در کپی کردن متن: ', err);
            });
        }

        // پردازش اولیه روی نمونه پیش‌فرض
        processConfigs();
    </script>
</body>
</html>
