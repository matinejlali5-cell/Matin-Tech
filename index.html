<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MATIN TECH // QUANTUM CORE ENGINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030407;
            --panel-rgb: 10, 12, 19;
            --panel-opacity: 0.85;
            --accent-hex: #00f2fe; 
            --accent-rgb: 0, 242, 254;
            --accent2-hex: #4facfe; 
            --text-color: #f8fafc;
            --grid-opacity: 0.2;
            --blur-intensity: 22px;
            --radius-val: 16px;
            --glow-intensity: 1.2;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --term-height: 440px;
            
            --bg: var(--bg-color);
            --card: rgb(var(--panel-rgb));
            --panel: rgba(var(--panel-rgb), var(--panel-opacity));
            --border: rgba(var(--accent-rgb), 0.25);
            --border-glow: rgba(var(--accent-rgb), calc(0.6 * var(--glow-intensity)));
            --text: var(--text-color);
            --muted: rgba(248, 250, 252, 0.45);
            --accent: var(--accent-hex);
            --accent2: var(--accent2-hex);
            --accent-glow: rgba(var(--accent-rgb), calc(0.45 * var(--glow-intensity)));
            
            --good: #10b981;
            --bad: #ef4444;
            --info: #06b6d4;
            
            --mono: 'JetBrains Mono', ui-monospace, monospace;
            --sans: var(--font-main);
            --radius: var(--radius-val);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Holographic Cyber Grid */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(var(--accent-rgb), 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(var(--accent-rgb), 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
            opacity: var(--grid-opacity);
        }

        /* Ambient Glow Spheres */
        .ambient-glow {
            position: fixed;
            width: 45vw; height: 45vw;
            background: radial-gradient(circle, rgba(var(--accent-rgb), 0.09) 0%, rgba(0,0,0,0) 70%);
            z-index: 0; pointer-events: none;
            filter: blur(90px);
            border-radius: 50%;
        }
        .ambient-1 { top: -15%; left: -10%; }
        .ambient-2 { bottom: -15%; right: -10%; background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, rgba(0,0,0,0) 70%); }

        /* --- LUXURY HEADER --- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 12, 19, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-box {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            color: #030407; font-weight: 800; font-size: 20px;
        }

        .header-title-group { display: flex; flex-direction: column; gap: 2px; }

        .header-title {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .header-title span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }
        
        .header-subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .header-btn {
            background: rgba(var(--accent-rgb), 0.08);
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            color: var(--accent);
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header-btn:hover {
            background: var(--accent);
            color: #030407;
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* --- MAIN LAYOUT --- */
        main {
            position: relative; z-index: 2;
            max-width: 1400px;
            margin: 36px auto;
            padding: 0 24px;
            display: grid;
            gap: 32px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 1024px) {
            main { grid-template-columns: 1.05fr 0.95fr; }
        }

        /* Glass Cards */
        .panel {
            background: var(--panel);
            backdrop-filter: blur(var(--blur-intensity));
            -webkit-backdrop-filter: blur(var(--blur-intensity));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .panel:hover {
            border-color: var(--border-glow);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(var(--accent-rgb), 0.1);
        }

        .panel-header {
            padding: 22px 26px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex; justify-content: space-between; align-items: center;
        }

        .panel-title {
            display: flex; align-items: center; gap: 12px;
            font-weight: 700; font-size: 13px; color: var(--text);
            letter-spacing: 0.08em; text-transform: uppercase;
        }

        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }

        .panel-body { padding: 26px; display: flex; flex-direction: column; gap: 22px; flex-grow: 1; }

        /* Form Controls */
        .input-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
        .input-label {
            font-size: 11px; font-weight: 700; color: var(--muted);
            letter-spacing: 0.05em; display: flex; align-items: center; justify-content: space-between;
            text-transform: uppercase;
        }

        textarea, input[type="text"], input[type="number"] {
            width: 100%; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
            padding: 14px 18px; color: var(--text);
            font-family: var(--mono); font-size: 13px;
            line-height: 1.5; outline: none; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        textarea { min-height: 140px; resize: vertical; padding-right: 56px; }

        textarea:focus, input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.15), inset 0 0 10px rgba(var(--accent-rgb), 0.05);
        }
        
        .attach-btn {
            position: absolute; right: 10px; bottom: 10px;
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
            color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.25s;
        }
        .attach-btn:hover { background: var(--accent); color: #030407; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .attach-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; }

        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }

        /* Checkbox Grid System */
        .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; }
        
        .check-box {
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 11px; border-radius: 12px;
            cursor: pointer; transition: all 0.25s ease; user-select: none;
        }
        .check-box:has(input:checked) {
            background: rgba(var(--accent-rgb), 0.12); border-color: var(--accent);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.15);
        }
        .check-box input { display: none; }
        .check-box span { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--muted); transition: color 0.2s; }
        .check-box:has(input:checked) span { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }

        /* Action Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2)); 
            color: #030407;
            border: none; border-radius: 14px;
            padding: 18px; font-size: 13px; font-weight: 800; letter-spacing: 0.1em;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 8px 30px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: var(--sans);
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.15);
            box-shadow: 0 12px 35px var(--accent-glow);
            transform: translateY(-2px);
        }

        .btn-primary:disabled { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.2); box-shadow: none; cursor: not-allowed; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text);
            padding: 14px; font-family: var(--sans); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
            cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 10px;
            border-radius: 12px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(var(--accent-rgb), 0.1); border-color: var(--accent);
            color: #fff; box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.15); transform: translateY(-1px);
        }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Terminal Console */
        .terminal-panel {
            background: #020305; border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
            position: relative; height: var(--term-height); transition: height 0.3s ease;
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.8);
        }

        .term-header {
            background: rgba(0, 0, 0, 0.5); padding: 12px 18px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .term-status-box { font-family: var(--mono); font-size: 11px; color: var(--muted); }
        .blink { animation: blink 1s step-end infinite; color: var(--accent); font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }

        .btn-clear {
            background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); color: var(--bad);
            font-family: var(--mono); font-size: 10px; padding: 4px 10px; cursor: pointer; transition: 0.2s;
            border-radius: 6px; font-weight: 700;
        }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.15); box-shadow: 0 0 10px rgba(239,68,68,0.2); }

        .term-body {
            padding: 16px; overflow-y: auto; flex-grow: 1; font-family: var(--mono);
            font-size: 12px; line-height: 1.6;
        }
        
        .term-body::-webkit-scrollbar { width: 5px; }
        .term-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .log-line {
            display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
            word-break: break-all;
        }

        .log-time { color: rgba(255,255,255,0.25); font-size: 10px; flex-shrink: 0; padding-top: 1px; }
        .log-badge {
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
            text-transform: uppercase; flex-shrink: 0; letter-spacing: 0.05em;
        }
        
        .badge-info { background: rgba(6, 182, 212, 0.12); color: var(--info); border: 1px solid rgba(6,182,212,0.3); }
        .badge-scan { background: rgba(79, 172, 254, 0.12); color: var(--accent2); border: 1px solid rgba(79,172,254,0.3); }
        .badge-ok { background: rgba(16, 185, 129, 0.12); color: var(--good); border: 1px solid rgba(16,185,129,0.3); }
        .badge-err { background: rgba(239, 68, 68, 0.12); color: var(--bad); border: 1px solid rgba(239,68,68,0.3); }

        .log-msg { color: #cbd5e1; }

        /* Progress Bar */
        .scan-progress { height: 3px; background: rgba(255,255,255,0.03); width: 100%; position: relative; overflow: hidden; }
        .scan-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent); }

        /* Results Box */
        .results-box {
            background: rgba(0, 0, 0, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 26px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .score-display {
            font-size: clamp(42px, 5.5vw, 68px); font-weight: 800; font-family: var(--sans); color: #fff;
            line-height: 1; margin-bottom: 20px;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 30px rgba(var(--accent-rgb), 0.25);
        }
        .score-display.bump { transform: scale(1.12); color: var(--accent); }

        /* Watermark */
        .matin-watermark {
            text-align: center; font-family: var(--sans); font-size: 11px; font-weight: 700;
            letter-spacing: 3px; padding: 30px 0; color: var(--muted); text-transform: uppercase;
        }
        .matin-watermark span { color: var(--accent); font-weight: 800; text-shadow: 0 0 10px var(--accent-glow); }

        /* Toast Notification Popup */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(10, 12, 19, 0.95); backdrop-filter: blur(20px);
            border: 1px solid var(--accent); color: #fff; padding: 14px 28px;
            border-radius: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px var(--accent-glow);
            z-index: 9999; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            opacity: 0; display: flex; align-items: center; gap: 10px;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #toast svg { width: 18px; height: 18px; stroke: var(--accent); }

        /* Settings Drawer Sidebar */
        .settings-panel {
            position: fixed; top: 0; right: -420px;
            width: 380px; max-width: 100vw; height: 100vh;
            background: rgba(8, 10, 16, 0.96); backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -30px 0 60px rgba(0,0,0,0.9); z-index: 1001;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .settings-panel.open { right: 0; }

        .settings-head {
            padding: 22px 26px; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex; justify-content: space-between; align-items: center;
        }
        .settings-head h2 { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; }
        .close-settings { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; transition: 0.2s; }
        .close-settings:hover { color: #fff; }

        .settings-body-panel { padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        .setting-item { display: flex; flex-direction: column; gap: 8px; }
        .setting-item label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; letter-spacing: 0.05em; }

        .setting-select {
            width: 100%; background: rgba(0,0,0,0.5); color: var(--text); border: 1px solid rgba(255,255,255,0.08);
            padding: 12px; border-radius: 12px; font-family: var(--sans); font-size: 12px; outline: none; cursor: pointer;
        }

        input[type="range"] { -webkit-appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.1); outline: none; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: var(--accent); cursor: pointer; border-radius: 50%; box-shadow: 0 0 10px var(--accent); }

        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 38px; border-radius: 12px; cursor: pointer; background: rgba(0,0,0,0.4); padding: 2px; border: 1px solid rgba(255,255,255,0.1); }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 10px; }

        .btn-reset { margin-top: 10px; padding: 14px }
    </style>
</head>
